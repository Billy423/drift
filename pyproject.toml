[project]
name = "drift"
version = "1.0.0"
description = "drift — code↔doc consistency agent; deterministic symbol comparison first, LLM for the residual."
readme = "README.md"
requires-python = ">=3.11"
# Upper bounds rather than a lockfile: a lockfile pins one machine's environment, while the CI
# matrix proves the range. Bounds are the next major, or the next minor for a 0.x project, where
# a minor is a breaking release — typer 0.26 to 0.27 changed every rendered help string.
dependencies = [
    "langgraph>=1.2,<2",
    "celery[redis]>=5.4,<6",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "griffe>=2.1,<3",
    "typer>=0.27,<0.28",
    "anthropic>=0.121,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.16,<0.17"]

[project.scripts]
drift = "drift.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["drift*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
